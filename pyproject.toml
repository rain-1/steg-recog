[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wmsteg-sprint"
version = "0.1.0"
description = "Minimal purple/orange watermark-recognition experiment for causal LLMs"
requires-python = ">=3.10"
dependencies = [
  "transformers>=5.14.0,<5.16",
  "tokenizers>=0.22",
  "accelerate>=1.10",
  "safetensors>=0.6",
  "numpy>=2.0",
]

[tool.setuptools.packages.find]
include = ["wmsteg*"]
