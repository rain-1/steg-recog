[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wmsteg-modal-datagen"
version = "2.9.2"
description = "Watermark-recognition, behavioral transfer, and local generative verbalization proof-of-concept experiments"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["wmsteg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
