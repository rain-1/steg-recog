[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wmsteg-modal-datagen"
version = "2.1.0"
description = "Parallel Modal proof-of-concept datagen for a reusable Qwen3 purple/orange watermark research bank"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["wmsteg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
