[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "wmsteg-modal-datagen"
version = "2.8.0"
description = "Modal watermark-recognition and multi-seed behavioral and watermark-only transfer proof-of-concept experiments"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["wmsteg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
